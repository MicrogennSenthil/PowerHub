      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFloor
      tags: [floors]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /room-types:
    get:
      operationId: listRoomTypes
      tags: [room-types]
      parameters:
        - $ref: "#/components/parameters/PropertyIdQuery"
      responses:
        "200":
          description: Room types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"
    post:
      operationId: createRoomType
      tags: [room-types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
  /room-types/{id}:
    patch:
      operationId: updateRoomType
      tags: [room-types]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRoomType
      tags: [room-types]
      parameters:
        - $ref: "#/components/parameters/IdPath"
