      operationId: getSettings
      tags: [settings]
      summary: Get global system / device-communication settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update global system / device-communication settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "400":
          $ref: "#/components/responses/BadRequest"

  /branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: Get public branding (logo, name, colour) — no auth required
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
    put:
      operationId: updateBranding
      tags: [branding]
      summary: Update branding (requires smartTv.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PropertyIdQuery:
      name: propertyId
      in: query
      required: true
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PermissionDef:
      type: object
      required: [key, label, group]
      properties:
        key: { type: string }
        label: { type: string }
        group: { type: string }

    CurrentUser:
      type: object
      required: [id, email, name, isSuperAdmin, permissions, properties]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        isSuperAdmin: { type: boolean }
        roleId: { type: ["integer", "null"] }
        roleName: { type: ["string", "null"] }
        permissions:
          type: array
          items: { type: string }
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"

    Property:
      type: object
      required: [id, name, code, currency, tariffPerKwh, timezone, active, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        pincode: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        currency: { type: string }
        tariffPerKwh: { type: number }
        timezone: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PropertyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        address: { type: string }
        city: { type: string }
        pincode: { type: string }
        email: { type: string }
        phone: { type: string }
        currency: { type: string }
        tariffPerKwh: { type: number, minimum: 0 }
        timezone: { type: string }
        active: { type: boolean }
    PropertyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        address: { type: string }
        city: { type: string }
        pincode: { type: string }
        email: { type: string }
        phone: { type: string }
        currency: { type: string }
        tariffPerKwh: { type: number, minimum: 0 }
        timezone: { type: string }
        active: { type: boolean }

    Block:
      type: object
      required: [id, propertyId, name, active]
      properties:
        id: { type: integer }
        propertyId: { type: integer }
        name: { type: string }
        active: { type: boolean }
    BlockInput:
      type: object
      required: [propertyId, name]
      properties:
        propertyId: { type: integer }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
    BlockUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        active: { type: boolean }

    Floor:
      type: object
