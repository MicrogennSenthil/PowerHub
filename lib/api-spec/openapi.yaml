openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PowerHub — multi-tenant hotel power/relay automation control system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Current user / session
  - name: properties
    description: Property (hotel) master
  - name: blocks
    description: Block master
  - name: floors
    description: Floor master
  - name: room-types
    description: Room type master
  - name: rooms
    description: Room master
  - name: control-types
    description: Control (load) type master
  - name: devices
    description: Relay device (box) master
  - name: controls
    description: Individual relay channels
  - name: process-types
    description: Process type + auto-cutoff master
  - name: roles
    description: Roles and permissions
  - name: users
    description: Application users and property allocation
  - name: dashboard
    description: Dashboard summaries
  - name: meta
    description: Static catalogs
  - name: settings
    description: Global software / device-communication setup
  - name: branding
    description: Smart TV / app branding (logo, name, colour)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user with role, permissions and allocated properties
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /permissions:
    get:
      operationId: listPermissions
      tags: [meta]
      summary: Catalog of assignable permissions (for building the rights UI without hardcoding)
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionDef"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties the current user can access
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/PropertyIdQuery"
      responses:
        "200":
          description: Blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
    post:
      operationId: createBlock
      tags: [blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/BadRequest"
  /blocks/{id}:
    patch:
      operationId: updateBlock
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBlock
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /floors:
    get:
      operationId: listFloors
      tags: [floors]
      parameters:
        - $ref: "#/components/parameters/PropertyIdQuery"
      responses:
        "200":
          description: Floors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Floor"
    post:
      operationId: createFloor
      tags: [floors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
