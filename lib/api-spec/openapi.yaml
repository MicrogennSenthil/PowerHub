    delete:
      operationId: deleteDevice
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /controls:
    get:
      operationId: listControls
      tags: [controls]
      summary: List relay channels for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Control"
  /controls/{id}:
    patch:
      operationId: updateControl
      tags: [controls]
      summary: Assign a relay channel to a room / load type and label it
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "404":
          $ref: "#/components/responses/NotFound"

  /process-types:
    get:
      operationId: listProcessTypes
      tags: [process-types]
      parameters:
        - $ref: "#/components/parameters/PropertyIdQuery"
      responses:
        "200":
          description: Process types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessType"
    post:
      operationId: createProcessType
      tags: [process-types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessType"
        "400":
          $ref: "#/components/responses/BadRequest"
  /process-types/{id}:
    patch:
      operationId: updateProcessType
      tags: [process-types]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessTypeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessType"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProcessType
      tags: [process-types]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
  /roles/{id}:
    patch:
      operationId: updateRole
      tags: [roles]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
